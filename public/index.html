<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drogon Guide Generator</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 40px auto; padding: 16px; background:#0b1220; color:#e2e8f0; }
    textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#fff; }
    button { padding: 12px 24px; font-size: 16px; margin-top: 10px; cursor: pointer; border-radius:8px; border:none; background:#38bdf8; color:#000; font-weight:bold; }
    pre { background: #0f172a; padding: 16px; border-radius: 8px; white-space: pre-wrap; border:1px solid #1e293b; }
  </style>
</head>
<body>
  <h2>🐉 Drogon Guide Generator</h2>
  <textarea id="prompt" placeholder="Yahan prompt likho..."></textarea>
  <br />
  <button onclick="generate()">Generate</button>
  <h3>Output:</h3>
  <pre id="output">Wait kar raha hai...</pre>

  <script>
    const APIS = [
      "https://drogon-guist-gen-ok3.vercel.app/generate",
      "https://drogon-guist-gen-ok1.vercel.app/generate",
      "https://drogon-guist-gen-ok.vercel.app/generate",
      "https://drogon-guist-gen.vercel.app/generate"
    ];

    async function generate() {
      const prompt = document.getElementById("prompt").value.trim();
      const output = document.getElementById("output");
      if (!prompt) { output.textContent = "Pehle prompt likho."; return; }
      output.textContent = "Loading...";

      for (const url of APIS) {
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: prompt })
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          output.textContent = JSON.stringify(data, null, 2);
          return;
        } catch (err) {
          console.warn("Fail:", url, err.message);
        }
      }
      output.textContent = "Saare API fail ho gaye.";
    }
  </script>
</body>
</html>
